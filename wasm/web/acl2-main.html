<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ACL2 in the browser (main thread)</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; display: flex;
         flex-direction: column; height: 100vh; }
  header { padding: .6rem 1rem; border-bottom: 1px solid #8884;
           display: flex; gap: 1rem; align-items: baseline; }
  header h1 { font-size: 1rem; margin: 0; }
  #status { font-size: .85rem; opacity: .75; }
  #log { flex: 1; overflow: auto; margin: 0; padding: 1rem;
         font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace;
         white-space: pre-wrap; }
  #log .in { color: #0a7; font-weight: 600; }
  #log .err { color: #c33; }
  #log .dim { opacity: .5; }
  form { display: flex; gap: .5rem; padding: .6rem 1rem;
         border-top: 1px solid #8884; }
  form span { font: 13px ui-monospace, monospace; opacity: .7; }
  input { flex: 1; font: 13px ui-monospace, monospace; padding: .35rem .5rem; }
  button { font: inherit; padding: .35rem .7rem; }
</style>
</head>
<body>
<header>
  <h1>ACL2 in the browser</h1>
  <span id="status">starting…</span>
  <span style="margin-left:auto"><a href="index.html">back</a></span>
</header>
<pre id="log"></pre>
<form id="f"><span>ACL2 !&gt;</span><input id="line" autocomplete="off"
  autocapitalize="off" spellcheck="false" placeholder="(+ 1 2)" disabled>
  <button id="clear" type="button">Clear</button></form>

<!-- The dynamic-linking build.  It must be on the main thread: a web worker
     gets 5,551 frames of stack and a page gets 10,339 (wasm/web/_stackprobe.html),
     and installing the world image needs more than the worker's half.  The cost
     is that the page is unresponsive while the image is installed. -->
<script src="lib/ecl-dylink.js"></script>
<script>
"use strict";

const logEl = document.getElementById('log');
const lineEl = document.getElementById('line');
const formEl = document.getElementById('f');
const statusEl = document.getElementById('status');

let inputText = '';
let inputPos = 0;
let busy = true;

function append(text, cls) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}
const status = (t) => { statusEl.textContent = t; };

// Lines that would otherwise repeat on every re-entry of the loop.
const NOISE = [
  /^ACL2 Version .*$/,
  /^Copyright \(C\)/,
  /^ACL2 comes with ABSOLUTELY NO WARRANTY/,
  /^This is free software and you are welcome/,
  /^ \+/, /^ *$/, /^ACL2 !>$/,
  /^Exiting the ACL2 read-eval-print loop\./,
  /^ECL \(Embeddable Common-Lisp\)/, /^Copyright \(C\) 19/,
  /^ECL is free software/, /^under certain conditions/,
  /^Type :h for Help\./, /^Top level\.$/, /^>+ $/,
  /^program exited \(with status: 0\)/, /unsupported syscall:/,
  // Re-entry noise.  Every input re-enters MAIN, which re-loads the driver and
  // restarts ACL2's loop, so these repeat once per form; none of them says
  // anything about the form.  See the comment in replay-web.lsp.
  /^;;; Loading #P"\/acl2\/web-replay\.lsp"/,
  /^Project-dir-alist:$/, /^\(\(:SYSTEM \. /,
  /^Type :help for help\.$/,
  /^Type \(quit\) to quit completely out of ACL2\.$/,
  /^ACL2 !>Bye\.$/,
];

async function fetchBuf(url, attempts = 10) {
  let last;
  for (let i = 0; i < attempts; i++) {
    try {
      const res = await fetch(url, {cache: 'no-store'});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.arrayBuffer();
    } catch (e) {
      last = e;
      await new Promise((r) => setTimeout(r, 300));
    }
  }
  throw new Error(`fetch ${url}: ${last && last.message}`);
}

async function fetchGz(url) {
  const packed = await fetchBuf(url);
  return await new Response(
    new Response(packed).body.pipeThrough(new DecompressionStream('gzip'))
  ).arrayBuffer();
}

let mod = null;

// Module is Emscripten's MODULARIZE factory from lib/ecl-dylink.js above.
(async () => {
  mod = await Module({
    noInitialRun: true,
    noExitRuntime: true,
    // The bdwgc in this wasm build is not fully sound: a root can be missed, and
    // the symptom is a structure that silently goes missing rather than a
    // crash.  wasm/acl2-wasm sets this for Node for exactly that reason, and a
    // page inherits no environment, so set it here too -- a lost world global is
    // one of the shapes that bug takes.
    ENV: { GC_INITIAL_HEAP_SIZE: '500000000' },
    locateFile: (p) => 'lib/ecl-dylink.' + p.split('.').pop(),
    print: (s) => { if (!NOISE.some((re) => re.test(s))) append(s); },
    printErr: (s) => { if (!NOISE.some((re) => re.test(s))) append(s, 'err'); },
    stdin: () => (inputPos < inputText.length
                  ? inputText.charCodeAt(inputPos++) : null),
  });

  const FS = mod.FS;
  try {
    const manifest = JSON.parse(
      new TextDecoder().decode(await fetchBuf('files.json')));
    let bytes = 0, done = 0;
    for (const f of manifest) {
      const buf = await fetchGz(f.src);
      bytes += buf.byteLength;
      FS.mkdirTree(f.dst.replace(/\/[^\/]*$/, ''));
      FS.writeFile(f.dst, new Uint8Array(buf));
      // include-book's book-hash includes the write date, so a book unpacked
      // with today's date is 'Uncertified'.  Put the original back.  FS.utime is
      // the name in this build, and it takes MILLISECONDS: passing the seconds
      // from the manifest lands the file in January 1970.
      const utime = FS.utime || FS.utimes;
      if (f.mtime && utime) utime.call(FS, f.dst, f.mtime * 1000, f.mtime * 1000);
      if (++done % 5 === 0) {
        status(`preloading ${done}/${manifest.length} ` +
               `(${(bytes / 1048576).toFixed(0)} MB)`);
        await new Promise((r) => setTimeout(r, 0));
      }
    }
    // LOAD-ACL2 and its callers read this to decide what state the sources are
    // in.  :INITIALIZED is what a working start has (the repo's own
    // acl2-status.txt says exactly this), because the image *is* an initialized
    // world; :COMPILED makes ACL2 think initialization still has to happen and
    // the install then fails in EXTEND-WORLD1.
    FS.writeFile('/acl2/acl2-status.txt', ':INITIALIZED');
    append(`[page] preloaded ${manifest.length} files, ` +
           `${(bytes / 1048576).toFixed(1)} MB`, 'dim');

    status('installing the world image (page will be unresponsive for ~1 min)');
    await new Promise((r) => setTimeout(r, 50));
    inputText = '';
    inputPos = 0;
    try { mod.callMain(['--load', '/acl2/web-replay.lsp', '--']); }
    catch (e) { if (!(e && typeof e === 'object' && 'status' in e)) throw e; }
    status('ACL2 ready');
    lineEl.disabled = false;
    lineEl.focus();
    busy = false;
  } catch (e) {
    append('[page] failed: ' + (e && e.stack ? e.stack : e), 'err');
    status('failed');
  }
})();

formEl.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (busy || !lineEl.value.trim()) return;
  const text = lineEl.value;
  append('ACL2 !>' + text, 'in');
  lineEl.value = '';
  busy = true;
  lineEl.disabled = true;
  status('running…');
  await new Promise((r) => setTimeout(r, 0));

  // Re-entering MAIN re-loads the driver (ECL caches its command line), and the
  // driver returns to ACL2's prompt when the world is already installed, so the
  // input is just the form: no (acl2::lp) prefix, which ACL2 would read as a
  // command of its own.
  inputText = text + '\n';
  inputPos = 0;
  try { mod.callMain([]); }
  catch (e) {
    if (e && typeof e === 'object' && 'status' in e) {
      // Normal: ACL2's loop exits at EOF and CALLMAIN reports the status.
    } else if (e instanceof RangeError) {
      // A page has about 1 MB of stack and ACL2's own recursion can exceed it:
      // including projects/apply/top needs 5-6 MB.  Say so, and do not pretend
      // the session still works -- after this the instance is unusable.
      append('[page] That form needed more stack than a page has.', 'err');
      append('[page] The session cannot continue; press Reload to start over.', 'err');
      statusEl.textContent = 'out of stack — reload';
      return;
    } else {
      append(String(e), 'err');
    }
  }
  busy = false;
  lineEl.disabled = false;
  lineEl.focus();
  status('ACL2 ready');
});

// Enter submits.  The form has no type="submit" button, and relying on implicit
// submission was unreliable: the form's submit event sometimes did not fire, and
// the field already holds the text so it looks like nothing happened.
lineEl.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') {
    ev.preventDefault();
    if (typeof formEl.requestSubmit === 'function') formEl.requestSubmit();
    else formEl.dispatchEvent(new Event('submit', {cancelable: true}));
  }
});

document.getElementById('clear').addEventListener('click', () => {
  logEl.textContent = '';
});
</script>
</body>
</html>
