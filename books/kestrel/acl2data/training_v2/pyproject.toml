[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acl2data-training-v2"
version = "0.1.0"
description = "Graph2Tocopo v2 — PLUR-compatible implementation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "ijson>=3.2.0",
    "tqdm>=4.65.0",
]

[tool.setuptools.packages.find]
include = ["training_v2*"]
