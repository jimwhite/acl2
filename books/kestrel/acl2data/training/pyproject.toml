[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acl2data-training"
version = "0.1.0"
description = "Graph2Tocopo training and serving for ACL2 proof recommendations"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy",
    "scikit-learn",
    "ijson>=3.2.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
server = ["faiss-cpu"]

[project.scripts]
acl2data-train = "training.train:main"
acl2data-serve = "training.server:main"

[tool.setuptools.packages.find]
include = ["training*"]
